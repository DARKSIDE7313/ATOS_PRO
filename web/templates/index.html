<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATOS PRO — 实时仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e6ed;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e,#0f1419);padding:16px 24px;border-bottom:1px solid #1e2a3a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:22px;font-weight:700;color:#4fc3f7}
.header .clock{font-size:14px;color:#8899aa;font-family:monospace}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.live{background:#4caf50;box-shadow:0 0 8px #4caf50}
.status-dot.closed{background:#ff9800;box-shadow:0 0 8px #ff9800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:16px;max-width:1600px;margin:0 auto}
.card{background:#131a24;border:1px solid #1e2a3a;border-radius:10px;overflow:hidden}
.card-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#8899aa;padding:12px 16px;background:#171e2a;border-bottom:1px solid #1e2a3a}
.kpi-row{display:flex;gap:12px;padding:12px 16px;flex-wrap:wrap}
.kpi{flex:1;min-width:90px;text-align:center}
.kpi .val{font-size:22px;font-weight:700;font-family:monospace}
.kpi .lbl{font-size:11px;color:#667788;margin-top:2px}
.up{color:#4caf50}.down{color:#f44336}.warn{color:#ff9800}
table{width:100%;font-size:12px;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-weight:500;color:#667788;font-size:11px;text-transform:uppercase;border-bottom:1px solid #1e2a3a}
td{padding:6px 12px;border-bottom:1px solid #0f1419;font-family:monospace;font-size:11px}
td.sym{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;font-size:13px}
tr:hover{background:#171e2a}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.badge-buy{background:#1b3a1b;color:#4caf50}
.badge-sell{background:#3a1b1b;color:#f44336}
.badge-wait{background:#1b2a3a;color:#8899aa}
.badge-phoenix{background:#1b1b3a;color:#7b9ea3}
.tab-row{display:flex;border-bottom:1px solid #1e2a3a}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;color:#667788;border-bottom:2px solid transparent;transition:.2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.tab:hover,.tab.active{color:#4fc3f7;border-bottom-color:#4fc3f7}
.tab-content{display:none;max-height:300px;overflow-y:auto}
.tab-content.active{display:block}
.footer{text-align:center;padding:12px;color:#445566;font-size:11px;border-top:1px solid #1e2a3a;margin-top:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.pulse{animation:pulse 2s infinite}
.num{text-align:right}
.no-data{color:#667788;font-size:12px;padding:20px;text-align:center}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:8px}.kpi .val{font-size:18px}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚡ ATOS PRO <span style="font-size:14px;color:#667788;font-weight:400">实时仪表盘</span></h1>
  </div>
  <div class="clock" id="clock">--</div>
</div>

<div class="grid">
  <!-- 总览 -->
  <div class="card" style="grid-column:1/-1">
    <div class="card-title">📊 组合总览</div>
    <div class="kpi-row">
      <div class="kpi"><div class="val" id="total-pv">--</div><div class="lbl">总资产</div></div>
      <div class="kpi"><div class="val" id="total-pnl">--</div><div class="lbl">总盈亏</div></div>
      <div class="kpi"><div class="val" id="total-ret">--</div><div class="lbl">总回报</div></div>
      <div class="kpi"><div class="val" id="total-cash">--</div><div class="lbl">总现金</div></div>
      <div class="kpi"><div class="val" id="mkt-status">--</div><div class="lbl" id="mkt-label">市场状态</div></div>
    </div>
  </div>

  <!-- Shadow 短线 -->
  <div class="card">
    <div class="card-title">🔴 短线 Shadow <span style="font-weight:400;font-size:11px;color:#667788" id="shadow-summary"></span></div>
    <div class="kpi-row">
      <div class="kpi"><div class="val" id="s-pv">--</div><div class="lbl">市值</div></div>
      <div class="kpi"><div class="val" id="s-pnl">--</div><div class="lbl">盈亏</div></div>
      <div class="kpi"><div class="val" id="s-ret">--</div><div class="lbl">回报</div></div>
    </div>
    <div style="max-height:350px;overflow-y:auto">
    <table><thead><tr><th>标的</th><th>持仓</th><th class="num">均价</th><th class="num">现价</th><th class="num">市值</th><th class="num">盈亏</th><th class="num">占比</th></tr></thead>
    <tbody id="short-pos"></tbody></table>
    </div>
  </div>

  <!-- LongTerm 长线 -->
  <div class="card">
    <div class="card-title">🔵 长线 LongTerm + Phoenix <span style="font-weight:400;font-size:11px;color:#667788" id="long-summary"></span></div>
    <div class="kpi-row">
      <div class="kpi"><div class="val" id="l-pv">--</div><div class="lbl">市值</div></div>
      <div class="kpi"><div class="val" id="l-pnl">--</div><div class="lbl">盈亏</div></div>
      <div class="kpi"><div class="val" id="l-holdings">--</div><div class="lbl">持仓数</div></div>
    </div>
    <div style="max-height:350px;overflow-y:auto">
    <table><thead><tr><th>标的</th><th>持仓</th><th class="num">均价</th><th class="num">现价</th><th class="num">市值</th><th class="num">盈亏</th><th>来源</th></tr></thead>
    <tbody id="long-pos"></tbody></table>
    </div>
  </div>

  <!-- 最近交易 -->
  <div class="card">
    <div class="card-title">📋 最近交易 <span style="font-weight:400;font-size:11px;color:#667788" id="trade-summary"></span></div>
    <div style="max-height:350px;overflow-y:auto">
    <table><thead><tr><th>时间</th><th>标的</th><th>方向</th><th>原因</th></tr></thead>
    <tbody id="trades-list"></tbody></table>
    </div>
  </div>

  <!-- AI Insights -->
  <div class="card">
    <div class="card-title">🧠 AI 决策 <span style="font-weight:400;font-size:11px;color:#667788" id="ai-summary"></span></div>
    <div class="tab-row">
      <div class="tab active" onclick="switchTab('v6')">v6 增强</div>
      <div class="tab" onclick="switchTab('v5')">v5 辩论</div>
    </div>
    <div class="tab-content active" id="tab-v6" style="max-height:280px">
      <table><thead><tr><th>标的</th><th>决策</th><th class="num">信心</th><th>原因</th></tr></thead>
      <tbody id="ai-v6"></tbody></table>
    </div>
    <div class="tab-content" id="tab-v5" style="max-height:280px">
      <table><thead><tr><th>时间</th><th>标的</th><th>决策</th><th class="num">信心</th></tr></thead>
      <tbody id="ai-v5"></tbody></table>
    </div>
  </div>
</div>

<div class="footer">ATOS PRO v3 · 数据每30秒刷新 · <span id="last-update">--</span></div>

<script>
const FMT = new Intl.NumberFormat('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const FMT2 = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function $(id){return document.getElementById(id)}
function pnlClass(v){return v>=0?'up':'down'}
function pnlSign(v){return v>=0?'+'+FMT.format(v):FMT.format(v)}
function pnlSignPct(v){return v>=0?'+'+v.toFixed(2)+'%':v.toFixed(2)+'%'}

function updateMarketClock(){
  const now=new Date();
  const mar=new Date(now.getUTCFullYear(),2,14);
  const nov=new Date(now.getUTCFullYear(),10,7);
  const isDst=now>=mar&&now<nov;
  const offset=isDst?-4:-5;
  const etH=((now.getUTCHours()+offset+24)%24);
  const etM=now.getUTCMinutes();const etS=now.getUTCSeconds();
  const etDay=new Date(now.getTime()+offset*3600000).getUTCDay();
  const timeStr=`${String(etH).padStart(2,'0')}:${String(etM).padStart(2,'0')}:${String(etS).padStart(2,'0')}`;
  const tz=isDst?'EDT':'EST';
  const mktMin=etH*60+etM;
  const isWeekday=etDay>=1&&etDay<=5;
  const mktOpen=isWeekday&&mktMin>=570&&mktMin<960;
  const dotCls=mktOpen?'live pulse':'closed';
  const tzName=isDst?'EDT':'EST';
  $('clock').innerHTML=`<span class="status-dot ${dotCls}"></span> ${timeStr} ${tzName} · ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][etDay]} · 市场${mktOpen?'开盘 🟢':'休市 🔴'}`;
  return {mktOpen,timeStr,tz:tzName,dayOfWeek:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][etDay]};
}

let mktInfo=updateMarketClock();
setInterval(()=>{mktInfo=updateMarketClock()},1000);

async function refresh(){
  try{
    const[short,long,ai,trades]=await Promise.all([
      fetch('/api/short?'+Date.now()).then(r=>r.json()).catch(()=>null),
      fetch('/api/long?'+Date.now()).then(r=>r.json()).catch(()=>null),
      fetch('/api/ai?'+Date.now()).then(r=>r.json()).catch(()=>null),
      fetch('/api/trades?'+Date.now()).then(r=>r.json()).catch(()=>null),
    ]);

    $('mkt-status').innerHTML=mktInfo.mktOpen?'🟢 开盘':'🔴 休市';
    $('mkt-label').innerText=mktInfo.mktOpen?'交易中...':'下一个交易日';

    // Shadow
    if(short&&!short.error){
      $('s-pv').innerHTML='$'+FMT.format(short.portfolio_value);
      $('s-pnl').innerHTML=`<span class="${pnlClass(short.pnl)}">${pnlSign(short.pnl)}</span>`;
      $('s-ret').innerHTML=`<span class="${pnlClass(short.return_pct)}">${pnlSignPct(short.return_pct)}</span>`;
      $('shadow-summary').innerText=`${short.positions.length}持仓 · ${short.cycles}周期`;
      let html='';
      short.positions.sort((a,b)=>Math.abs(b.pnl)-Math.abs(a.pnl)).forEach(p=>{
        html+=`<tr>
          <td class="sym">${p.sym}</td><td>${p.qty}股</td>
          <td class="num">$${FMT2.format(p.avg)}</td><td class="num">$${FMT2.format(p.price)}</td>
          <td class="num">$${FMT.format(p.value)}</td>
          <td class="num ${pnlClass(p.pnl)}">${pnlSign(p.pnl)} (${pnlSignPct(p.return_pct)})</td>
          <td class="num">${p.weight}%</td></tr>`;
      });
      $('short-pos').innerHTML=html||'<tr><td colspan="7" class="no-data">无持仓</td></tr>';
    }

    // LongTerm
    if(long&&!long.error){
      $('l-pv').innerHTML='$'+FMT.format(long.portfolio_value);
      $('l-pnl').innerHTML=`<span class="${pnlClass(long.pnl)}">${pnlSign(long.pnl)}</span>`;
      $('l-holdings').innerText=long.holdings.length;
      $('long-summary').innerText=`${long.holdings.length}持仓 · ${long.runs}次运行`;
      let html='';
      long.holdings.sort((a,b)=>Math.abs(b.pnl)-Math.abs(a.pnl)).forEach(p=>{
        html+=`<tr>
          <td class="sym">${p.sym}</td><td>${p.qty}股</td>
          <td class="num">$${FMT2.format(p.avg)}</td><td class="num">$${FMT2.format(p.price)}</td>
          <td class="num">$${FMT.format(p.value)}</td>
          <td class="num ${pnlClass(p.pnl)}">${pnlSign(p.pnl)} (${pnlSignPct(p.return_pct)})</td>
          <td><span class="badge ${p.source==='phoenix_v3'?'badge-phoenix':'badge-wait'}">${p.source||'longterm'}</span></td></tr>`;
      });
      $('long-pos').innerHTML=html||'<tr><td colspan="7" class="no-data">无持仓</td></tr>';
    }

    // Combined totals
    if(short&&long&&!short.error&&!long.error){
      const totalPv=(short.portfolio_value||0)+(long.portfolio_value||0);
      const totalPnl=(short.pnl||0)+(long.pnl||0);
      const totalCash=(short.cash||0)+(long.cash||0);
      const initCapital=1300000; // $300K short + $1M long
      const totalRet=((totalPv-initCapital)/initCapital*100);
      $('total-pv').innerHTML='$'+FMT.format(totalPv);
      $('total-pnl').innerHTML=`<span class="${pnlClass(totalPnl)}">${pnlSign(totalPnl)}</span>`;
      $('total-ret').innerHTML=`<span class="${pnlClass(totalRet)}">${pnlSignPct(totalRet)}</span>`;
      $('total-cash').innerHTML='$'+FMT.format(totalCash);
    }

    // Trades
    if(trades){
      $('trade-summary').innerText=`${trades.total}笔 · W${trades.win_trades}/L${trades.loss_trades}`;
      let html='';
      trades.recent.reverse().forEach(t=>{
        const isBuy=(t.action||'').includes('BUY');
        html+=`<tr>
          <td style="color:#667788;font-size:10px">${(t.time||'').slice(5,16)}</td>
          <td class="sym">${t.symbol}</td>
          <td><span class="badge ${isBuy?'badge-buy':'badge-sell'}">${t.action}</span></td>
          <td style="font-size:11px;color:#8899aa">${t.reason||''}</td></tr>`;
      });
      $('trades-list').innerHTML=html||'<tr><td colspan="4" class="no-data">无记录</td></tr>';
    }

    // AI
    if(ai){
      $('ai-summary').innerText=`v5:${ai.v5_count}条 · v6:${ai.v6_count}条`;
      let v6html='';
      (ai.recent_v6||[]).reverse().forEach(d=>{
        const v=(d.verdict||'');
        v6html+=`<tr>
          <td class="sym">${d.symbol}</td>
          <td><span class="badge ${v.includes('BUY')?'badge-buy':v.includes('SELL')?'badge-sell':'badge-wait'}">${d.verdict||'?'}</span></td>
          <td class="num">${((d.confidence||0)*100).toFixed(0)}%</td>
          <td style="font-size:11px;color:#8899aa">${(d.reason||'').slice(0,60)}</td></tr>`;
      });
      $('ai-v6').innerHTML=v6html||'<tr><td colspan="4" class="no-data">暂无v6决策</td></tr>';
      let v5html='';
      (ai.recent_v5||[]).reverse().forEach(d=>{
        v5html+=`<tr>
          <td style="font-size:10px;color:#667788">${(d.time||'').slice(5,16)}</td>
          <td class="sym">${d.symbol}</td>
          <td><span class="badge ${(d.action||'').includes('BUY')?'badge-buy':d.action==='SELL'?'badge-sell':'badge-wait'}">${d.action}</span></td>
          <td class="num">${((d.confidence||0)*100).toFixed(0)}%</td></tr>`;
      });
      $('ai-v5').innerHTML=v5html||'<tr><td colspan="4" class="no-data">暂无v5决策</td></tr>';
    }

    $('last-update').innerText='更新于 '+new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    console.error('Refresh error:',e);
  }
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  $('tab-'+name).classList.add('active');
}

refresh();
setInterval(refresh,30000);
</script>
</body>
</html>
