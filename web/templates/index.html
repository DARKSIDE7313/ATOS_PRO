<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATOS PRO — 机构级策略仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b0d10; --surface:#12161c; --surface2:#171c23; --surface3:#1d2430;
  --border:rgba(255,255,255,.08); --text:#e8edf5; --muted:#8b95a7; --faint:#566074;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --gold:#f59e0b; --teal:#14b8a6;
  --green-bg:rgba(34,197,94,.12); --red-bg:rgba(239,68,68,.12); --blue-bg:rgba(59,130,246,.12);
  --gold-bg:rgba(245,158,11,.12); --teal-bg:rgba(20,184,166,.12);
  --radius:14px; --radius-sm:8px;
  --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.5}
header{
  height:58px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; border-bottom:1px solid var(--border); background:rgba(11,13,16,.9);
  backdrop-filter:blur(10px); position:sticky; top:0; z-index:20;
}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-weight:600;font-size:15px}
.logo svg{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:12px}
.small{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.btn{
  border:1px solid rgba(20,184,166,.28); background:var(--teal-bg); color:var(--teal);
  padding:7px 13px; border-radius:10px; cursor:pointer; font-size:12px; font-weight:600;
}
.btn:hover{background:rgba(20,184,166,.22)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-run{
  border:1px solid rgba(34,197,94,.28); background:var(--green-bg); color:var(--green);
  padding:8px 20px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
}
.btn-run:hover{background:rgba(34,197,94,.22)}
.btn-run:disabled{opacity:.4;cursor:not-allowed}
main{padding:22px;max-width:1400px;margin:0 auto}
.status{
  display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;font-size:12px;color:var(--muted)
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.off{background:var(--faint);box-shadow:none}
.section-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  margin:20px 0 10px; font-weight:700;
}
.controls{
  display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;flex-wrap:wrap;
}
.controls label{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.controls input, .controls select{
  background:var(--surface3);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:8px;font-size:13px;font-family:var(--font-mono);
  outline:none;
}
.controls input:focus, .controls select:focus{border-color:var(--teal)}
.controls select{min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; position:relative; overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--teal);opacity:.7}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.value{font-size:28px;line-height:1;font-weight:700;font-family:var(--font-mono);margin-bottom:8px}
.sub{font-size:12px;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;font-family:var(--font-mono)}
.b-green{background:var(--green-bg);color:var(--green)} .b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-gold{background:var(--gold-bg);color:var(--gold)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
}
.chart-title{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600}
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; overflow-x:auto;
}
.panel-title{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:500;font-family:var(--font-mono);font-size:11px}
td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--font-mono)}
.pnl-pos{color:var(--green)} .pnl-neg{color:var(--red)}
.side-buy{color:var(--green);font-weight:600} .side-sell{color:var(--red);font-weight:600}
.empty{
  background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
  padding:32px; text-align:center; color:var(--muted); font-size:13px;
}
.spinner{
  display:inline-block;width:14px;height:14px;border:2px solid var(--surface3);
  border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
#results{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.charts{grid-template-columns:1fr} .kpis{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
      <polyline points="16 7 22 7 22 13"></polyline>
    </svg>
    ATOS PRO
  </div>
  <div class="topbar-right">
    <div class="small" id="updatedAt">—</div>
  </div>
</header>

<main>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">输入股票代码，选择策略，开始回测</span></div>

  <div class="section-title">回测控制</div>
  <div class="controls">
    <label>代码</label>
    <input type="text" id="ticker" value="NVDA" placeholder="NVDA" style="width:100px">
    <label>策略</label>
    <select id="strategy">
      <option value="rsi2">RSI-2 极端反转</option>
      <option value="bollinger">布林带均值回归</option>
      <option value="momentum">双动量趋势</option>
      <option value="trend">EMA 趋势跟踪</option>
    </select>
    <button class="btn-run" id="runBtn" onclick="runStrategy()">▶ 运行回测</button>
  </div>

  <div id="results">
    <div class="section-title">实时概览</div>
    <div class="kpis" id="kpis"></div>

    <div class="section-title">趋势图表</div>
    <div class="charts">
      <div class="chart-card">
        <div class="chart-title">价格走势 & 信号</div>
        <canvas id="priceChart" height="200"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">每笔 PnL 分布</div>
        <canvas id="pnlChart" height="200"></canvas>
      </div>
    </div>

    <div class="section-title">交易记录</div>
    <div class="panel">
      <table>
        <thead><tr><th>#</th><th>方向</th><th>价格</th><th>盈亏</th><th>原因</th></tr></thead>
        <tbody id="tradesBody"></tbody>
      </table>
    </div>
  </div>

  <div class="empty" id="noData">输入股票代码，选择策略，点击「运行回测」开始</div>
</main>

<script>
let priceChart, pnlChart;

function pct(v,d=1){return (v*100).toFixed(d)+'%'}

async function getStrategies(){
  try{return await (await fetch('/api/strategies')).json()}catch{return {}}
}

async function runStrategy(){
  const ticker = document.getElementById('ticker').value.trim().toUpperCase();
  if(!ticker) return;
  const strategy = document.getElementById('strategy').value;

  document.getElementById('runBtn').disabled = true;
  document.getElementById('statusText').innerHTML = '<span class="spinner"></span>正在获取 ' + ticker + ' 数据并运行 ' + strategy.toUpperCase() + ' 策略...';
  document.getElementById('statusDot').classList.remove('off');
  document.getElementById('results').style.display = 'none';
  document.getElementById('noData').style.display = 'none';

  try{
    const resp = await fetch('/api/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticker, strategy, capital:100000})
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    if(data.error){ throw new Error(data.error); }
    renderResults(data);
    document.getElementById('results').style.display = 'block';
    document.getElementById('noData').style.display = 'none';
    document.getElementById('statusText').textContent = `${data.strategy || strategy} — ${ticker}: ${data.total_trades} 笔交易`;
    document.getElementById('updatedAt').textContent = '更新: ' + new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('statusText').textContent = '错误: ' + e.message;
    document.getElementById('statusDot').classList.add('off');
  }finally{
    document.getElementById('runBtn').disabled = false;
  }
}

function renderResults(data){
  const trades = data.trades || [];
  const wins = trades.filter(t=>t.pnl>0);
  const losses = trades.filter(t=>t.pnl<=0);
  const totalPnl = trades.reduce((s,t)=>s+t.pnl,0);
  const wr = trades.length ? wins.length/trades.length : 0;

  // KPIs
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl_pct,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,t)=>s+t.pnl_pct,0)/losses.length : 0;
  const rr = avgLoss ? Math.abs(avgWin/avgLoss) : 0;

  document.getElementById('kpis').innerHTML = [
    {label:'策略', value:data.strategy||'—', cls:'', sub:'回测模式', badge:''},
    {label:'胜率', value:wr ? pct(wr,0) : '—', cls:wr>=0.55?'pos':'', sub:`${trades.length} 笔交易`, badge:`<span class="badge ${wr>=0.6?'b-green':'b-gold'}">${wr>=0.6?'良好':'偏低'}</span>`},
    {label:'净盈亏', value:totalPnl>=0?'+$'+totalPnl.toFixed(0):'-$'+Math.abs(totalPnl).toFixed(0), cls:totalPnl>=0?'pos':'neg', sub:`${wins.length}胜 ${losses.length}负`, badge:''},
    {label:'盈亏比', value:rr.toFixed(2)+'x', cls:rr>=2?'pos':'', sub:'目标 ≥ 2.0x', badge:''},
    {label:'平均盈利', value:'+'+avgWin.toFixed(1)+'%', cls:'pos', sub: `最大 +${Math.max(...trades.map(t=>t.pnl_pct||0),0).toFixed(1)}%`, badge:''},
    {label:'平均亏损', value:avgLoss.toFixed(1)+'%', cls:'neg', sub:`最大 -${Math.abs(Math.min(...trades.map(t=>t.pnl_pct||0),0)).toFixed(1)}%`, badge:'<span class="badge b-red">RISK</span>'}
  ].map(c=>`
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value ${c.cls}">${c.value}</div>
      <div class="sub">${c.badge} ${c.sub}</div>
    </div>
  `).join('');

  // Price chart
  if(priceChart) priceChart.destroy();
  const prices = data.price_data || [];
  const labels = prices.filter((_,i)=>i%Math.max(1,Math.floor(prices.length/30))===0).map(p=>{
    try{return (p.time||'').slice(0,10)}catch{return ''}
  });
  const closeVals = prices.filter((_,i)=>i%Math.max(1,Math.floor(prices.length/30))===0).map(p=>p.close);

  priceChart = new Chart(document.getElementById('priceChart'), {
    type:'line',
    data:{labels,datasets:[{
      label:'Close',data:closeVals,borderColor:'#14b8a6',
      backgroundColor:'rgba(20,184,166,.08)',fill:true,tension:.3,borderWidth:1.5,pointRadius:0
    }]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#566074',maxTicksLimit:12,font:{size:9}}},y:{ticks:{color:'#8b95a7',font:{size:10}}}}}
  });

  // PnL distribution chart
  if(pnlChart) pnlChart.destroy();
  const lastTrades = trades.slice(-25);
  pnlChart = new Chart(document.getElementById('pnlChart'), {
    type:'bar',
    data:{labels: lastTrades.map((_,i)=>'#'+(trades.length-lastTrades.length+i+1)),
      datasets:[{data:lastTrades.map(t=>(t.pnl_pct||0).toFixed(2)),
        backgroundColor:lastTrades.map(t=>(t.pnl_pct||0)>=0?'rgba(34,197,94,.7)':'rgba(239,68,68,.7)')}]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#566074',font:{size:9}}},y:{ticks:{color:'#8b95a7',callback:v=>v+'%',font:{size:10}}}}}
  });

  // Trades table
  document.getElementById('tradesBody').innerHTML = trades.map((t,i)=>{
    const pnlClass = t.pnl>0?'pnl-pos':'pnl-neg';
    const sideClass = t.side==='BUY'?'side-buy':'side-sell';
    const reason = (t.reason||'').substring(0,40);
    return `<tr>
      <td style="color:var(--faint)">#${i+1}</td>
      <td class="${sideClass}">${t.side==='BUY'?'BUY':'SELL'}</td>
      <td>$${Number(t.price).toFixed(2)}</td>
      <td class="${pnlClass}">${t.pnl>=0?'+':''}$${Number(t.pnl).toFixed(0)} <span style="font-size:10px;color:var(--faint)">${t.pnl_pct>=0?'+':''}${(t.pnl_pct||0).toFixed(1)}%</span></td>
      <td style="color:var(--muted)">${reason}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
